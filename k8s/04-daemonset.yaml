apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k3s-dash-agent
  namespace: k3s-dash
  labels:
    app: k3s-dash-agent
spec:
  selector:
    matchLabels:
      app: k3s-dash-agent
  template:
    metadata:
      labels:
        app: k3s-dash-agent
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      # wk carries node-role.kubernetes.io/control-plane:NoSchedule, plus
      # dedicated=control-plane-only:NoSchedule since the wk0 migration
      # walled it off from ordinary workloads. Without these tolerations
      # the DaemonSet silently skips it and the control-plane laptop shows
      # no battery and no temperature — with no error anywhere to explain
      # why. The monitoring agent is exactly the kind of node-local,
      # near-zero-footprint pod that dedication taint is not meant to keep
      # out.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: dedicated
          operator: Equal
          value: control-plane-only
          effect: NoSchedule
      containers:
        - name: agent
          image: ghcr.io/wkn00/k3s-dash:0.8.3
          args: ["agent", "--addr=:9100", "--root=/host"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 9100
              name: hw
          volumeMounts:
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: hw }
            initialDelaySeconds: 2
            periodSeconds: 20
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: sys
          hostPath: { path: /sys, type: Directory }
        - name: proc
          hostPath: { path: /proc, type: Directory }
