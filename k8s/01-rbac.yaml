apiVersion: v1
kind: ServiceAccount
metadata:
  name: k3s-dash
  namespace: k3s-dash
---
# Read-only, cluster-wide. No write verb appears anywhere in this file,
# and none should ever be added: the dashboard has no feature that needs
# one, so any future create/patch/delete here is a bug or an attack.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k3s-dash-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  # Disk usage comes from each kubelet's stats endpoint through the API
  # server's node proxy; metrics-server does not expose filesystem stats.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k3s-dash-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k3s-dash-reader
subjects:
  - kind: ServiceAccount
    name: k3s-dash
    namespace: k3s-dash
