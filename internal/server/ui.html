<style>
  /* Roles, not raw hex, so light/dark swap in one place.

     One neutral ramp, one accent (blue), and the fixed status palette —
     nothing else carries colour. Metric icons used to each have their own
     hue; at seven hues the page read as a rainbow and the status colours
     stopped standing out, so icons are now neutral and only status is
     coloured. Warning is still deliberately sub-3:1 as a fill on the light
     surface, which is why every severity on this page ships a word as well
     as a colour, and why the badge text uses the darker *-ink step.

     Shape scale: panels 12px, controls 8px, badges 6px. Nothing else. */
  :root {
    color-scheme: light;
    --plane:          #f4f5f7;
    --surface-1:      #fefefe;
    --surface-2:      #f1f2f4;
    --surface-3:      #e8eaed;
    --text-primary:   #111318;
    --text-secondary: #4a505c;
    --text-muted:     #7b818c;
    --grid:           #eceef1;
    --border:         #e1e4e8;
    --border-strong:  #cfd3d9;
    --accent:         #2563eb;
    --accent-soft:    #8fb2f5;
    --accent-fill:    rgba(37, 99, 235, 0.10);
    --accent-bg:      rgba(37, 99, 235, 0.08);
    --track:          #e6e8ec;
    --good:           #16a34a;
    --good-ink:       #15803d;
    --good-bg:        rgba(22, 163, 74, 0.10);
    --warning:        #d97706;
    --warning-ink:    #b45309;
    --warning-bg:     rgba(217, 119, 6, 0.11);
    --critical:       #dc2626;
    --critical-ink:   #b91c1c;
    --critical-bg:    rgba(220, 38, 38, 0.09);
    --shadow:         0 1px 2px rgba(17, 19, 24, 0.04);
    --shadow-lg:      0 12px 40px rgba(17, 19, 24, 0.14), 0 2px 6px rgba(17, 19, 24, 0.06);
    --header-bg:      rgba(244, 245, 247, 0.82);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --plane:          #0b0c0e;
      --surface-1:      #131519;
      --surface-2:      #1b1e23;
      --surface-3:      #252930;
      --text-primary:   #eceef1;
      --text-secondary: #a9aeb8;
      --text-muted:     #737984;
      --grid:           #1f2227;
      --border:         #24282e;
      --border-strong:  #343941;
      --accent:         #5b93f5;
      --accent-soft:    #3a68c4;
      --accent-fill:    rgba(91, 147, 245, 0.14);
      --accent-bg:      rgba(91, 147, 245, 0.12);
      --track:          #262a31;
      --good-ink:       #4ade80;
      --good-bg:        rgba(34, 197, 94, 0.13);
      --warning-ink:    #fbbf24;
      --warning-bg:     rgba(245, 158, 11, 0.14);
      --critical-ink:   #f87171;
      --critical-bg:    rgba(239, 68, 68, 0.14);
      --shadow:         0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-lg:      0 16px 48px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
      --header-bg:      rgba(11, 12, 14, 0.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --plane:          #0b0c0e;
    --surface-1:      #131519;
    --surface-2:      #1b1e23;
    --surface-3:      #252930;
    --text-primary:   #eceef1;
    --text-secondary: #a9aeb8;
    --text-muted:     #737984;
    --grid:           #1f2227;
    --border:         #24282e;
    --border-strong:  #343941;
    --accent:         #5b93f5;
    --accent-soft:    #3a68c4;
    --accent-fill:    rgba(91, 147, 245, 0.14);
    --accent-bg:      rgba(91, 147, 245, 0.12);
    --track:          #262a31;
    --good-ink:       #4ade80;
    --good-bg:        rgba(34, 197, 94, 0.13);
    --warning-ink:    #fbbf24;
    --warning-bg:     rgba(245, 158, 11, 0.14);
    --critical-ink:   #f87171;
    --critical-bg:    rgba(239, 68, 68, 0.14);
    --shadow:         0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-lg:      0 16px 48px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
    --header-bg:      rgba(11, 12, 14, 0.8);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--text-primary);
    font: 14px/1.5 var(--sans);
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); font-size: 0.92em; }
  .muted { color: var(--text-secondary); font-size: 12px; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--header-bg); border-bottom: 1px solid var(--border);
    -webkit-backdrop-filter: saturate(160%) blur(12px); backdrop-filter: saturate(160%) blur(12px);
  }
  .header-inner {
    max-width: 1600px; margin: 0 auto; padding: 10px 28px;
    display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; min-height: 60px;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px; flex: none;
    display: flex; align-items: center; justify-content: center;
    background: var(--text-primary); color: var(--plane);
  }
  .brand h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; font-weight: 650; line-height: 1.2; }
  .brand .tagline { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
  .grow { flex: 1 1 auto; }

  /* Live sample indicator: a pulsing dot reads as "this is moving" at a
     glance — a plain timestamp doesn't communicate liveness on its own. */
  .live {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary);
    padding: 0 2px 0 14px; margin-left: 4px; border-left: 1px solid var(--border); height: 28px;
  }
  .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex: none; position: relative; }
  .live .dot::after {
    content: ""; position: absolute; inset: -3px; border-radius: 50%;
    background: var(--good); opacity: 0;
  }
  @media (prefers-reduced-motion: no-preference) {
    .live:not(.stale) .dot::after { animation: live-ping 2s cubic-bezier(0, 0, .2, 1) infinite; }
  }
  .live.stale .dot, .live.stale .dot::after { background: var(--critical); }
  @keyframes live-ping { 0% { transform: scale(.6); opacity: .45; } 80%, 100% { transform: scale(1.6); opacity: 0; } }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle {
    display: inline-flex; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); padding: 2px; gap: 2px;
  }
  .toggle button {
    font: inherit; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer;
    background: none; border: 0; border-radius: 6px; padding: 3px 10px; line-height: 20px;
    transition: color .15s ease, background-color .15s ease;
  }
  .toggle button:hover { color: var(--text-primary); }
  .toggle button[aria-pressed="true"] {
    background: var(--surface-1); color: var(--text-primary);
    box-shadow: 0 0 0 1px var(--border), var(--shadow);
  }
  .toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- Layout ---------- */
  main {
    padding: 24px 28px 48px; display: grid; gap: 32px;
    transition: opacity .2s ease; max-width: 1600px; margin: 0 auto;
  }
  /* Refetch failure holds the previous render rather than flashing a
     skeleton — no layout jump, and the numbers stay readable. */
  main.stale { opacity: .55; }
  section { min-width: 0; }
  .section-head { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .section-head h2 { font-size: 14px; font-weight: 650; margin: 0; letter-spacing: -0.005em; }
  .count {
    font-size: 11.5px; font-weight: 600; color: var(--text-secondary);
    background: var(--surface-3); border-radius: 6px; padding: 0 7px; line-height: 20px;
  }
  .count:empty { display: none; }
  .section-head .hint { margin-left: auto; font-size: 12px; color: var(--text-muted); }

  .panel {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  }

  .banner {
    display: none; align-items: flex-start; gap: 10px;
    padding: 10px 14px; border-radius: 12px; font-size: 13px;
    border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent);
    background: var(--warning-bg); color: var(--text-primary);
  }
  .banner.on { display: flex; }
  .banner svg { color: var(--warning-ink); flex: none; margin-top: 1px; }

  /* ---------- Severity, badges, meters ---------- */
  /* Severity is carried by a word plus the colour, never the colour alone,
     and never by recolouring the value itself. */
  .sev {
    font-size: 11px; font-weight: 600; line-height: 18px; padding: 0 6px;
    border-radius: 6px; white-space: nowrap;
  }
  .sev.warning  { color: var(--warning-ink);  background: var(--warning-bg); }
  .sev.critical { color: var(--critical-ink); background: var(--critical-bg); }

  /* Status pills: a tinted chip with a leading dot. The dot is the one
     place a status dot appears — it marks real state, not decoration. */
  .pill {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    font-size: 11.5px; font-weight: 600; line-height: 20px; padding: 0 8px;
    border-radius: 6px; white-space: nowrap;
  }
  .pill.good, .pill.critical, .pill.warning { padding-left: 7px; }
  .pill.good::before, .pill.critical::before, .pill.warning::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }
  .pill.good     { color: var(--good-ink);     background: var(--good-bg); }
  .pill.warning  { color: var(--warning-ink);  background: var(--warning-bg); }
  .pill.critical { color: var(--critical-ink); background: var(--critical-bg); }
  .pill.plain    { color: var(--text-secondary); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); }

  .meter { height: 6px; width: 100%; border-radius: 3px; background: var(--track); overflow: hidden; }
  .meter > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .meter > i.warning { background: var(--warning); }
  .meter > i.critical { background: var(--critical); }

  /* Neutral icon chip. Colour here would have to mean something, and the
     only things on this page that mean something are status. */
  .badge {
    width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; flex: none; background: var(--surface-2); color: var(--text-secondary);
    box-shadow: inset 0 0 0 1px var(--border);
  }

  /* ---------- Overview strip ---------- */
  /* One panel, one cell per fleet metric, hairlines between cells. The
     negative right/bottom margin hides the outer edge of the last column
     and row, so the grid can wrap to any width without a dangling border
     or an orphaned card on its own row. */
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    margin: 0 -1px -1px 0;
  }
  .kpi {
    padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    position: relative;
  }
  .kpi.sev-warning::before, .kpi.sev-critical::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  }
  .kpi.sev-warning::before { background: var(--warning); }
  .kpi.sev-critical::before { background: var(--critical); }
  .kpi-top { display: flex; align-items: center; gap: 7px; color: var(--text-muted); }
  .kpi-top svg { flex: none; }
  .kpi-label { font-size: 12.5px; color: var(--text-secondary); font-weight: 500; }
  .kpi-readout { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; min-height: 34px; }
  .kpi-value { font-size: 24px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.2; }
  .kpi-value .of { color: var(--text-muted); font-weight: 500; font-size: 0.7em; letter-spacing: 0; }
  .kpi-note { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; min-height: 18px; }
  .kpi-viz { height: 24px; display: flex; align-items: center; }
  .kpi-viz svg { max-width: 100%; }

  /* ---------- Device cards ---------- */
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); }
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-width: 0;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  /* The worst metric on the card tints its edge and draws a 2px rule at
     the top, so trouble is visible from across the room before anyone
     reads a number. */
  .card.sev-warning  { border-color: color-mix(in srgb, var(--warning) 45%, var(--border)); box-shadow: inset 0 2px 0 var(--warning), var(--shadow); }
  .card.sev-critical { border-color: color-mix(in srgb, var(--critical) 45%, var(--border)); box-shadow: inset 0 2px 0 var(--critical), var(--shadow); }

  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-title { min-width: 0; }
  .card h3 {
    font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -0.01em; line-height: 1.35;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .card h3 .alias { color: var(--text-muted); font-weight: 400; font-size: 12px; font-family: var(--mono); letter-spacing: 0; }
  .card-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  /* The device line answers "which box is this?" — an icon plus the
     words, so identity reads before any number does. */
  .device { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-secondary); margin: 12px 0 0; min-width: 0; }
  .device .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.35; }
  .device .model { color: var(--text-primary); font-weight: 500; overflow-wrap: anywhere; }
  .device .class { font-size: 12px; color: var(--text-muted); }
  .device.unknown { color: var(--text-muted); font-style: italic; cursor: help; }

  /* The spec is context rather than status, so it sits a step further
     back, and wraps instead of widening the card when a distro ships a
     long os-release string. */
  .spec { color: var(--text-muted); font-size: 12px; overflow-wrap: anywhere; margin-top: 10px; line-height: 1.55; }
  .spec + .spec { margin-top: 0; }

  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--grid);
  }
  .stats .tile.wide { grid-column: 1 / -1; }
  .stats .viz { height: 24px; display: flex; align-items: center; }
  .viz svg { max-width: 100%; }

  .tile { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tile .head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .tile .readout { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 2px 6px; min-width: 0; }
  .tile .value { white-space: nowrap; font-size: 13.5px; font-weight: 600; }
  .tile .label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .tile .note { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }

  /* Detailed density restores the full-width metric rows: one metric per
     line, label and reading on the same baseline as the trend.

     The head dissolves with display:contents so its label and value become
     grid items of the row alongside the trend, and `order` puts them back
     in reading order — label, trend, reading, severity. Rebuilding the DOM
     instead would mean the toggle could not take effect until the next
     poll, which is a poor trade for a viewing preference. */
  .detailed .stats { grid-template-columns: 1fr; gap: 10px; }
  .detailed .stats .tile,
  .detailed .stats .tile.wide {
    display: grid; grid-column: 1 / -1;
    grid-template-columns: 64px 1fr auto;
    gap: 4px 12px; align-items: center;
  }
  .detailed .stats .head { display: contents; }
  .detailed .stats .label   { order: 1; }
  .detailed .stats .viz     { order: 2; height: 26px; }
  .detailed .stats .readout { order: 3; }
  .detailed .stats .note    { order: 4; grid-column: 2 / -1; }
  .detailed .cards { grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); }

  /* The whole card is the click target for its pop-out modal, so it needs
     its own hover/focus affordance rather than a small button's. */
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: var(--border-strong); }
  .card.clickable.sev-warning:hover  { border-color: var(--warning); }
  .card.clickable.sev-critical:hover { border-color: var(--critical); }
  .card.clickable:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Tables (namespaces, workloads) ---------- */
  .split { display: grid; gap: 32px; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
  @media (max-width: 1100px) { .split { grid-template-columns: minmax(0, 1fr); } }

  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: left; font-weight: 500; font-size: 12px; color: var(--text-muted);
    padding: 9px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.data td { padding: 10px 16px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.data tr:last-child td { border-bottom: 0; }
  table.data .num { text-align: right; white-space: nowrap; }
  table.data .end { text-align: right; width: 1%; white-space: nowrap; }
  table.data .name { font-weight: 500; overflow-wrap: anywhere; }
  table.data .sub { color: var(--text-secondary); }
  table.data .dim { color: var(--text-muted); }
  table.data td.empty { color: var(--text-muted); text-align: center; padding: 22px 16px; }
  /* Namespace rows drill into their own modal. The name is a real button
     (keyboard + screen reader), the row is the larger mouse target. */
  table.data tr.drill { cursor: pointer; }
  table.data tr.drill:hover td { background: var(--surface-2); }
  .row-link {
    font: inherit; font-weight: 500; color: inherit; background: none; border: 0; padding: 0;
    cursor: pointer; text-align: left; border-radius: 4px;
  }
  .row-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chev { color: var(--text-muted); display: inline-flex; vertical-align: middle; margin-left: 6px; }
  @media (max-width: 640px) {
    table.data .hide-sm { display: none; }
    table.data th, table.data td { padding-left: 12px; padding-right: 12px; }
  }

  /* ---------- Warnings ---------- */
  ul.events { list-style: none; margin: 0; padding: 0; }
  .alert { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--grid); }
  .alert:last-child { border-bottom: 0; }
  .alert-icon {
    flex: none; width: 28px; height: 28px; border-radius: 8px;
    background: var(--warning-bg); color: var(--warning-ink); display: flex; align-items: center; justify-content: center;
  }
  .alert-body { min-width: 0; flex: 1; }
  .alert-head { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
  .alert-head strong { font-weight: 600; font-size: 13.5px; }
  .alert-head .obj { color: var(--text-secondary); font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .alert-head .when { margin-left: auto; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  .alert .msg { color: var(--text-secondary); font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .empty { color: var(--text-muted); font-size: 13px; padding: 18px 16px; text-align: center; }
  .empty.ok { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .empty.ok svg { color: var(--good); }

  /* ---------- Modals ---------- */
  /* A native <dialog>, so Escape-to-close, the backdrop and focus
     trapping all come for free instead of being hand-rolled. */
  .device-modal {
    border: 1px solid var(--border); border-radius: 12px; padding: 0;
    background: var(--surface-1); color: var(--text-primary); box-shadow: var(--shadow-lg);
    width: min(640px, calc(100vw - 32px)); max-height: 84vh;
  }
  .device-modal::backdrop { background: rgba(8, 9, 11, 0.45); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  @media (prefers-reduced-motion: no-preference) {
    .device-modal[open] { animation: modal-in .16s cubic-bezier(.16, 1, .3, 1); }
  }
  @keyframes modal-in { from { opacity: 0; transform: translateY(6px) scale(.99); } }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }
  .modal-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .modal-sub:empty { display: none; }
  .modal-close {
    flex: none; border: 0; background: none; color: var(--text-muted);
    width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--surface-2); color: var(--text-primary); }
  .modal-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .modal-body { padding: 4px 18px 18px; overflow-y: auto; max-height: calc(84vh - 62px); }
  .modal-body h4 {
    font-size: 12px; color: var(--text-secondary); margin: 18px 0 6px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .drill-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .drill-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 12px; border-bottom: 1px solid var(--grid); font-size: 13px;
  }
  .drill-row:last-child { border-bottom: none; }
  .drill-row .main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .drill-row .name { overflow-wrap: anywhere; font-weight: 500; }
  .drill-row .meta { font-size: 12px; color: var(--text-muted); overflow-wrap: anywhere; }
  .drill-row .meter { width: 220px; max-width: 100%; margin-top: 5px; }
  .modal-body .empty { border: 1px dashed var(--border); border-radius: 8px; padding: 12px; }

  /* Key/value spec sheet for the device modal: two columns of short
     facts, so the platform strings that used to crowd the card have
     somewhere to live. */
  .facts {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin: 0;
  }
  /* Dividers are drawn as outset shadows so the ones past the last row
     and column fall outside the box and get clipped — no dangling rules
     whatever the column count works out to. */
  .facts > div {
    display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px;
    box-shadow: 1px 0 0 var(--grid), 0 1px 0 var(--grid); font-size: 12.5px; min-width: 0;
  }
  .facts dt { color: var(--text-muted); flex: none; }
  .facts dd { margin: 0; text-align: right; overflow-wrap: anywhere; min-width: 0; }

  .site-footer {
    max-width: 1600px; margin: 0 auto; padding: 18px 28px 28px;
    font-size: 12px; color: var(--text-muted); display: flex; justify-content: space-between; gap: 12px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 640px) {
    .header-inner { padding: 10px 16px; }
    main { padding: 18px 16px 40px; gap: 26px; }
    .site-footer { padding: 16px; }
    .live { border-left: 0; padding-left: 0; margin-left: 0; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    .detailed .cards { grid-template-columns: minmax(0, 1fr); }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ---------- 3D room ---------- */
  .room3d {
    position: relative; height: clamp(420px, 72vh, 780px); overflow: hidden;
    border: 1px solid var(--border); border-radius: 12px; background: #0b1622;
  }
  .room3d[hidden], .cards[hidden] { display: none; }
  .room3d-msg {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px; color: #9fb3c8; font-size: 13px; pointer-events: none;
  }
  .room3d-msg:empty { display: none; }
  .section-head .toggle { margin-left: 12px; }
  .toggle button:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <div>
        <h1>k3s cluster</h1>
        <div class="tagline">Homelab fleet monitor</div>
      </div>
    </div>
    <div class="live" id="live" role="status"><i class="dot"></i><span id="stamp">Connecting…</span></div>
    <span class="grow"></span>
    <div class="controls">
      <div class="toggle" role="group" aria-label="Theme">
        <button type="button" id="theme-auto" aria-pressed="true">Auto</button>
        <button type="button" id="theme-light" aria-pressed="false">Light</button>
        <button type="button" id="theme-dark" aria-pressed="false">Dark</button>
      </div>
      <div class="toggle" role="group" aria-label="Card density">
        <button type="button" id="density-compact" aria-pressed="true">Compact</button>
        <button type="button" id="density-detailed" aria-pressed="false">Detailed</button>
      </div>
    </div>
  </div>
</header>
<main id="main">
  <div class="banner" id="degraded" role="alert"></div>
  <section aria-labelledby="overview-heading">
    <div class="section-head"><h2 id="overview-heading">Overview</h2></div>
    <div class="panel"><div class="kpis" id="kpis"></div></div>
  </section>
  <section aria-labelledby="devices-heading">
    <div class="section-head">
      <h2 id="devices-heading">Devices</h2><span class="count" id="devices-count"></span>
      <span class="hint" id="devices-hint">Click a device for details</span>
      <div class="toggle" role="group" aria-label="Devices view">
        <button type="button" id="view-cards" aria-pressed="true">Cards</button>
        <button type="button" id="view-3d" aria-pressed="false">3D Room</button>
      </div>
    </div>
    <div class="cards" id="nodes"></div>
    <div class="room3d" id="room3d" hidden><div class="room3d-msg" id="room3d-msg" role="status"></div></div>
  </section>
  <div class="split">
    <section aria-labelledby="workloads-heading">
      <div class="section-head"><h2 id="workloads-heading">Workloads</h2><span class="count" id="workloads-count"></span></div>
      <div class="panel">
        <table class="data">
          <thead><tr>
            <th>Name</th><th class="hide-sm">Namespace</th><th class="hide-sm">Kind</th>
            <th class="num">Ready</th><th class="num hide-sm">Restarts</th><th class="end">Status</th>
          </tr></thead>
          <tbody id="workloads"></tbody>
        </table>
      </div>
    </section>
    <section aria-labelledby="namespaces-heading">
      <div class="section-head"><h2 id="namespaces-heading">Namespaces</h2><span class="count" id="namespaces-count"></span></div>
      <div class="panel">
        <table class="data">
          <thead><tr>
            <th>Name</th><th class="num">Pods</th><th class="num hide-sm">Healthy</th><th class="end">Status</th>
          </tr></thead>
          <tbody id="namespaces"></tbody>
        </table>
      </div>
    </section>
  </div>
  <section aria-labelledby="events-heading">
    <div class="section-head"><h2 id="events-heading">Warnings</h2><span class="count" id="events-count"></span><span class="hint">Last hour</span></div>
    <div class="panel"><ul class="events" id="events"></ul></div>
  </section>
</main>
<footer class="site-footer"><span>Built by Wael</span><span>Refreshes every 5s</span></footer>
<dialog class="device-modal" id="device-modal" aria-labelledby="modal-title">
  <div class="modal-head">
    <div><h2 id="modal-title"></h2><div class="modal-sub" id="modal-sub"></div></div>
    <button type="button" class="modal-close" id="modal-close" aria-label="Close"></button>
  </div>
  <div class="modal-body" id="modal-body"></div>
</dialog>
<dialog class="device-modal" id="namespace-modal" aria-labelledby="namespace-modal-title">
  <div class="modal-head">
    <div><h2 id="namespace-modal-title"></h2><div class="modal-sub" id="namespace-modal-sub"></div></div>
    <button type="button" class="modal-close" id="namespace-modal-close" aria-label="Close"></button>
  </div>
  <div class="modal-body" id="namespace-modal-body"></div>
</dialog>
<script>
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

const has = v => v !== null && v !== undefined;

function fmtPct(v)  { return has(v) ? v.toFixed(0) + "%" : "—"; }
function fmtTemp(v) { return has(v) ? v.toFixed(0) + "°C" : "—"; }

function fmtBytes(v) {
  if (!has(v)) return "—";
  const units = ["B", "KiB", "MiB", "GiB", "TiB"];
  let i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return v.toFixed(v >= 10 || i === 0 ? 0 : 1) + " " + units[i];
}

function fmtUptime(s) {
  if (!has(s)) return "—";
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600);
  return d > 0 ? d + "d " + h + "h" : h + "h " + Math.floor((s % 3600) / 60) + "m";
}

// A pod's age, in the same "d h" / "h m" shape as a node's uptime — reused
// rather than reinvented, since both answer "how long has this been
// running" from a duration in seconds.
function fmtAge(iso) {
  if (!iso || String(iso).startsWith("0001")) return "—";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  return isNaN(s) || s < 0 ? "—" : fmtUptime(s);
}

// How long the node has been *in the cluster*, which is not the uptime
// beside it: a laptop rebooted an hour ago is still a two-month-old member.
function fmtSince(iso) {
  if (!iso || String(iso).startsWith("0001")) return "";
  const days = (Date.now() - new Date(iso).getTime()) / 86400000;
  if (isNaN(days)) return "";
  if (days < 1) return "joined today";
  if (days < 60) return "joined " + Math.round(days) + "d ago";
  return "joined " + Math.round(days / 30) + "mo ago";
}

// Severity thresholds live in one place so colour and wording never drift.
// The comparison uses the *displayed* (rounded) value: a disk at 79.6%
// renders as "80%", and a card that reads 80% with no warning beside it
// looks broken to anyone who knows the threshold is 80.
function level(v, warn, bad) {
  if (!has(v)) return "";
  const shown = Math.round(v);
  if (shown >= bad) return "critical";
  if (shown >= warn) return "warning";
  return "";
}

const THRESHOLDS = {
  cpu:  [75, 90],
  mem:  [80, 92],
  disk: [80, 90],
  temp: [75, 85],
};

// The sparkline is the trend channel of a stat tile: the line recedes in a
// de-emphasis step and the current reading is the accent dot, so the eye
// lands on "now" and reads the history as context. Nulls are failed
// samples, so the line breaks rather than drawing a straight segment
// across a period nothing was known about.
function sparkline(values, label, unit, opts) {
  opts = opts || {};
  const w = opts.width || 120, h = opts.height || 22, pad = 3;
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.setAttribute("role", "img");

  const real = (values || []).filter(has);
  const title = document.createElementNS(SVGNS, "title");
  title.textContent = real.length < 2
    ? label + ": no history yet"
    : label + " over the last 2h: low " + Math.min(...real).toFixed(0) + unit +
      ", high " + Math.max(...real).toFixed(0) + unit;
  svg.appendChild(title);
  svg.setAttribute("aria-label", title.textContent);
  if (real.length < 2) return svg;

  let lo = has(opts.min) ? opts.min : Math.min(...real);
  let hi = has(opts.max) ? opts.max : Math.max(...real);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }

  const x = i => pad + (i / Math.max(values.length - 1, 1)) * (w - 2 * pad);
  const y = v => h - pad - ((v - lo) / (hi - lo)) * (h - 2 * pad);

  // Each unbroken run gets a faint area under it, which gives the trend
  // some weight without competing with the line, then the line itself.
  let run = [];
  const flush = () => {
    if (run.length >= 2) {
      const first = run[0].split(",")[0], last = run[run.length - 1].split(",")[0];
      const area = document.createElementNS(SVGNS, "path");
      area.setAttribute("d", "M" + run.join(" L") + " L" + last + "," + (h - pad) + " L" + first + "," + (h - pad) + " Z");
      area.setAttribute("fill", "var(--accent-fill)");
      svg.appendChild(area);
      const path = document.createElementNS(SVGNS, "path");
      path.setAttribute("d", "M" + run.join(" L"));
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "var(--accent)");
      path.setAttribute("stroke-opacity", "0.75");
      path.setAttribute("stroke-width", "1.5");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("stroke-linecap", "round");
      svg.appendChild(path);
    }
    run = [];
  };
  let lastIdx = -1;
  values.forEach((v, i) => {
    if (!has(v)) { flush(); return; }
    lastIdx = i;
    run.push(x(i).toFixed(1) + "," + y(v).toFixed(1));
  });
  flush();

  if (lastIdx >= 0) {
    // The end dot carries a ring in the surface colour so it stays legible
    // where it sits on top of the line it terminates.
    const dot = document.createElementNS(SVGNS, "circle");
    dot.setAttribute("cx", x(lastIdx).toFixed(1));
    dot.setAttribute("cy", y(values[lastIdx]).toFixed(1));
    dot.setAttribute("r", "2.75");
    dot.setAttribute("fill", "var(--accent)");
    dot.setAttribute("stroke", "var(--surface-1)");
    dot.setAttribute("stroke-width", "2");
    svg.appendChild(dot);
  }
  return svg;
}

// Meter: the unfilled track is a lighter step of the fill's own ramp, so
// the bar reads as one object rather than a fill on neutral grey.
function meter(pct, severity) {
  const bar = el("div", "meter");
  const fill = el("i", severity);
  fill.style.width = Math.max(0, Math.min(100, pct || 0)) + "%";
  bar.appendChild(fill);
  return bar;
}

// Stat tile: label, value, optional severity word, optional trend. The
// same component builds a device card metric — density toggling costs no
// second render path since it's pure CSS around the same markup.
function tile(label, valueText, opts) {
  opts = opts || {};
  const box = el("div", "tile" + (opts.wide ? " wide" : ""));
  const head = el("div", "head");
  head.appendChild(el("span", "label", label));
  const readout = el("div", "readout");
  readout.appendChild(el("span", "value", valueText));
  if (opts.severity) readout.appendChild(el("span", "sev " + opts.severity, opts.word || opts.severity));
  head.appendChild(readout);
  box.appendChild(head);
  if (opts.viz) {
    const viz = el("div", "viz");
    viz.appendChild(opts.viz);
    box.appendChild(viz);
  }
  if (opts.note) box.appendChild(el("span", "note", opts.note));
  return box;
}

// One small icon set for the overview KPI row and device/alert badges,
// drawn the same way the chassis glyphs are: strokes on currentColor, so
// every icon themes with the badge colour around it rather than carrying
// its own.
const ICONS = {
  devices:   "M1.5 2.5h13v4h-13zM1.5 9.5h13v4h-13zM3.5 4.5h1M3.5 11.5h1",
  cpu:       "M5.5 5.5h9v9h-9zM8 2.5v2M12 2.5v2M8 15.5v2M12 15.5v2M2.5 8h2M2.5 12h2M15.5 8h2M15.5 12h2",
  memory:    "M3 4.5h14v3h-14zM3 8.5h14v3h-14zM3 12.5h14v3h-14z",
  disk:      "M2.5 4.5h15v11h-15zM2.5 8.5h15M13 12.5h.01M15.5 12.5h.01",
  temp:      "M10 3v8",
  power:     "M11 2L4 12h5l-1.5 7L17 8h-5.5z",
  workloads: "M3 3h5v5h-5zM12 3h5v5h-5zM3 12h5v5h-5zM12 12h5v5h-5z",
  warning:   "M10 2.3L18.3 17h-16.6zM10 7.3v4.7M10 14.7h.01",
  alert:     "M10 2.8L18 16.6H2zM10 7.6v4M10 14.2v.01",
  check:     "M4.5 10.5l3.5 3.5 7.5-8",
  chevron:   "M7.5 4.5l5.5 5.5-5.5 5.5",
  close:     "M5 5l10 10M15 5L5 15",
};

// icon() builds a small badge glyph from one of the ICONS paths, with an
// optional extra circle (the thermometer bulb) or a solid fill (the power
// bolt reads better filled than outlined at this size).
function icon(name, opts) {
  opts = opts || {};
  const svg = document.createElementNS(SVGNS, "svg");
  const size = String(opts.size || 16);
  svg.setAttribute("width", size);
  svg.setAttribute("height", size);
  svg.setAttribute("viewBox", "0 0 20 20");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("d", ICONS[name]);
  path.setAttribute("fill", opts.fill ? "currentColor" : "none");
  path.setAttribute("stroke", opts.fill ? "none" : "currentColor");
  path.setAttribute("stroke-width", "1.5");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  if (opts.circle) {
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", opts.circle[0]);
    c.setAttribute("cy", opts.circle[1]);
    c.setAttribute("r", opts.circle[2]);
    c.setAttribute("fill", "none");
    c.setAttribute("stroke", "currentColor");
    c.setAttribute("stroke-width", "1.5");
    svg.appendChild(c);
  }
  return svg;
}

// The 3-node mark in the header — an abstract cluster, not a chassis, so it
// reads as the product rather than as one more device glyph.
function logoMark() {
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", "20");
  svg.setAttribute("height", "20");
  svg.setAttribute("viewBox", "0 0 24 24");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("d", "M6 18L12 7L18 18Z");
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "1.6");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  for (const [cx, cy] of [[6, 18], [18, 18], [12, 7]]) {
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", cx); c.setAttribute("cy", cy); c.setAttribute("r", "2.4");
    // Filled with the logo chip's own background so each node reads as a
    // ring sitting on top of the edges it joins.
    c.setAttribute("fill", "var(--text-primary)");
    c.setAttribute("stroke", "currentColor");
    c.setAttribute("stroke-width", "1.6");
    svg.appendChild(c);
  }
  return svg;
}

// One cell of the overview strip: a muted icon and label, the value, an
// optional severity word, then a trend or a note. The icon is neutral —
// on this page colour is reserved for status.
function kpiCard(iconName, iconOpts, label, valueText, opts) {
  opts = opts || {};
  const card = el("div", "kpi" + (opts.severity ? " sev-" + opts.severity : ""));
  const top = el("div", "kpi-top");
  top.appendChild(icon(iconName, Object.assign({ size: 15 }, iconOpts)));
  top.appendChild(el("span", "kpi-label", label));
  card.appendChild(top);
  const readout = el("div", "kpi-readout");
  if (opts.valueNode) readout.appendChild(opts.valueNode);
  else readout.appendChild(el("span", "kpi-value", valueText));
  if (opts.severity && !opts.wordInValue) readout.appendChild(el("span", "sev " + opts.severity, opts.word || opts.severity));
  card.appendChild(readout);
  if (opts.viz) {
    const viz = el("div", "kpi-viz");
    viz.appendChild(opts.viz);
    card.appendChild(viz);
  }
  if (opts.note) card.appendChild(el("div", "kpi-note", opts.note));
  return card;
}

function batteryReadout(n) {
  const b = n.battery;
  if (!b || (!has(b.percent) && !has(b.acOnline))) {
    // The agent answered, and what it found was no battery — a mini-PC or
    // a Pi. That is a fact about the device, not a missing reading, so it
    // gets a word rather than the em dash that means "not known".
    if (has(n.uptimeSeconds) || has(n.tempC)) return { text: "no battery", sev: "", word: "", absent: true };
    return { text: "—", sev: "", word: "" };
  }
  if (!has(b.percent)) return { text: b.acOnline ? "on AC" : "on battery", sev: "", word: "" };
  const onBattery = b.status === "Discharging";
  const text = b.percent + "%" + (onBattery ? " · on battery" : (b.acOnline ? " · AC" : ""));
  if (onBattery && b.percent < 25) return { text, sev: "critical", word: "low" };
  if (onBattery) return { text, sev: "warning", word: "unplugged" };
  return { text, sev: "", word: "" };
}

// Whether the per-node agent has ever reported anything for this node, as
// opposed to reporting and finding no battery. A node with no agent at all
// (missing DaemonSet toleration, ImagePullBackOff, ...) gets one tile that
// says so, rather than two tiles individually shrugging with an em dash —
// that reads as broken next to a fully-populated card, not as "unknown".
function hasAgentData(n) {
  const b = n.battery;
  return has(n.cpuModel) || has(n.uptimeSeconds) || has(n.tempC) ||
    (b != null && (has(b.percent) || has(b.acOnline)));
}

// One row shape for both lists in a device's drill-down: a primary label,
// an optional muted meta line under it, and a status pill pinned right.
function drillRow(primary, meta, pillClass, pillText) {
  const li = el("li", "drill-row");
  const main = el("div", "main");
  main.appendChild(el("span", "name", primary));
  if (meta) main.appendChild(el("span", "meta", meta));
  li.appendChild(main);
  li.appendChild(el("span", "pill " + pillClass, pillText));
  return li;
}

function drillWorkloadRow(w) {
  const bits = [w.namespace, w.kind, w.ready + "/" + w.desired];
  if (w.restarts) bits.push(w.restarts + (w.restarts === 1 ? " restart" : " restarts"));
  return drillRow(w.name, bits.join(" · "), w.healthy ? "good" : "critical", w.healthy ? "ok" : "degraded");
}

function drillPodRow(p) {
  const bits = [p.namespace];
  if (p.restarts) bits.push(p.restarts + (p.restarts === 1 ? " restart" : " restarts"));
  bits.push(fmtAge(p.createdAt));
  return drillRow(p.name, bits.join(" · "), p.healthy ? "good" : "critical", p.phase);
}

// Quota keys carry their unit in the name (limits.cpu, requests.memory,
// pods, count/services, ...) — there is no separate unit field in the
// Kubernetes API, so the resource name is what tells cores from bytes
// from a plain object count.
function fmtQuotaValue(resource, v) {
  if (resource.includes("cpu")) return (v < 10 && v % 1 !== 0 ? v.toFixed(2) : v.toFixed(0)) + " cores";
  if (resource.includes("memory") || resource.includes("storage")) return fmtBytes(v);
  return String(Math.round(v));
}

function fmtKV(m) {
  return Object.entries(m || {}).map(([k, v]) => k + "=" + v).join(", ");
}

function drillQuotaRow(q) {
  const sev = level(q.percent, 80, 95);
  const pillText = has(q.percent) ? q.percent.toFixed(0) + "%" : "—";
  const li = drillRow(q.resource, fmtQuotaValue(q.resource, q.used) + " / " + fmtQuotaValue(q.resource, q.hard),
    sev || "plain", pillText);
  if (has(q.percent)) li.querySelector(".main").appendChild(meter(q.percent, sev));
  return li;
}

function drillLimitRangeRow(item) {
  const parts = [];
  if (Object.keys(item.default || {}).length) parts.push("default " + fmtKV(item.default));
  if (Object.keys(item.defaultRequest || {}).length) parts.push("request " + fmtKV(item.defaultRequest));
  if (Object.keys(item.min || {}).length) parts.push("min " + fmtKV(item.min));
  if (Object.keys(item.max || {}).length) parts.push("max " + fmtKV(item.max));
  return drillRow(item.type, parts.join(" · "), "plain", "limit");
}

function drillPVCRow(p) {
  const bits = [p.storageClass || "no storage class", fmtBytes(p.capacityBytes)];
  if (p.accessModes && p.accessModes.length) bits.push(p.accessModes.join(", "));
  return drillRow(p.name, bits.join(" · "), p.bound ? "good" : "critical", p.phase);
}

function drillServiceRow(s) {
  const ports = (s.ports || []).map(p => p.port + "/" + p.protocol).join(", ");
  const bits = [s.clusterIP || "—"];
  if (ports) bits.push(ports);
  return drillRow(s.name, bits.join(" · "), "plain", s.type);
}

// One table cell, optionally with a class — the tables are built the same
// way as every other element on the page, through textContent only.
function td(cls, text) { return el("td", cls, text); }

function statusCell(healthy, okText, badText) {
  const c = td("end");
  c.appendChild(el("span", "pill " + (healthy ? "good" : "critical"), healthy ? okText : badText));
  return c;
}

// The fleet-wide workload table: one row per workload regardless of which
// device it landed on. Ready reads as a fraction so a 3/4 DaemonSet is
// obviously one pod short, not just "degraded".
function workloadRow(w) {
  const tr = el("tr");
  tr.appendChild(td("name", w.name));
  tr.appendChild(td("sub hide-sm", w.namespace));
  tr.appendChild(td("dim hide-sm", w.kind));
  tr.appendChild(td("num", w.ready + "/" + w.desired));
  tr.appendChild(td("num hide-sm" + (w.restarts ? "" : " dim"), String(w.restarts)));
  tr.appendChild(statusCell(w.healthy, "ok", "degraded"));
  return tr;
}

// A namespace row drills into its own modal. The name is a real <button>
// so keyboard and screen-reader users get a proper control; the row is the
// bigger mouse target and catches the button's click as it bubbles.
function namespaceRow(ns) {
  const tr = el("tr", "drill");
  const name = td("name");
  const btn = el("button", "row-link", ns.name);
  btn.type = "button";
  btn.setAttribute("aria-haspopup", "dialog");
  name.appendChild(btn);
  tr.appendChild(name);
  tr.appendChild(td("num", String(ns.podCount)));
  tr.appendChild(td("num hide-sm" + (ns.workloadCount ? "" : " dim"),
    ns.workloadCount ? (ns.workloadCount - ns.unhealthyWorkloads) + "/" + ns.workloadCount : "—"));
  const healthy = ns.unhealthyWorkloads === 0;
  const status = statusCell(healthy, "ok", "degraded");
  const chev = el("span", "chev");
  chev.appendChild(icon("chevron", { size: 14 }));
  status.appendChild(chev);
  tr.appendChild(status);
  tr.addEventListener("click", () => openNamespaceModal(ns));
  return tr;
}

// A modal section heading with its item count in the same chip style the
// page's own section headings use.
function modalHeading(text, n) {
  const h = el("h4", null, text);
  if (has(n)) h.appendChild(el("span", "count", String(n)));
  return h;
}

function openNamespaceModal(ns) {
  document.getElementById("namespace-modal-title").textContent = ns.name;
  const sub = [ns.phase, ns.podCount + (ns.podCount === 1 ? " pod" : " pods")];
  if (ns.workloadCount) sub.push((ns.workloadCount - ns.unhealthyWorkloads) + "/" + ns.workloadCount + " workloads healthy");
  const created = fmtSince(ns.createdAt).replace(/^joined/, "created");
  if (created) sub.push(created);
  document.getElementById("namespace-modal-sub").textContent = sub.join(" · ");
  const body = document.getElementById("namespace-modal-body");
  body.replaceChildren();

  if (ns.quota.length) {
    body.appendChild(modalHeading("Quota"));
    const ql = el("ul", "drill-list");
    ql.replaceChildren(...ns.quota.map(drillQuotaRow));
    body.appendChild(ql);
  }
  if (ns.limitRanges.length) {
    body.appendChild(modalHeading("Limit ranges"));
    const ll = el("ul", "drill-list");
    ll.replaceChildren(...ns.limitRanges.map(drillLimitRangeRow));
    body.appendChild(ll);
  }

  body.appendChild(modalHeading("PVCs", ns.pvcs.length));
  if (ns.pvcs.length) {
    const pl = el("ul", "drill-list");
    pl.replaceChildren(...ns.pvcs.map(drillPVCRow));
    body.appendChild(pl);
  } else {
    body.appendChild(el("div", "empty", "No PVCs in this namespace."));
  }

  body.appendChild(modalHeading("Services", ns.services.length));
  if (ns.services.length) {
    const sl = el("ul", "drill-list");
    sl.replaceChildren(...ns.services.map(drillServiceRow));
    body.appendChild(sl);
  } else {
    body.appendChild(el("div", "empty", "No services in this namespace."));
  }

  document.getElementById("namespace-modal").showModal();
}

function initNamespaceModal() {
  const modal = document.getElementById("namespace-modal");
  modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
  document.getElementById("namespace-modal-close").addEventListener("click", () => modal.close());
}

// One 14px glyph per chassis class, drawn on currentColor so it themes with
// the badge colour around it. The word is always rendered too — the shape
// narrows the search, it never carries the meaning alone.
const GLYPHS = {
  laptop:       "M3.5 3.5h9v6h-9zM1.5 11h13l-1 1.5h-11z",
  desktop:      "M4.5 1.5h7v13h-7zM6 3.5h4M6 5.5h4",
  "mini-pc":    "M1.5 4.5h13v7h-13zM3.5 8h2M11.5 8h1",
  "all-in-one": "M2.5 2.5h11v8h-11zM6.5 13h3M8 10.5v2.5",
  server:       "M1.5 2.5h13v4h-13zM1.5 9.5h13v4h-13zM3.5 4.5h1M3.5 11.5h1",
  sbc:          "M3.5 3.5h9v9h-9zM6 1.5v2M10 1.5v2M6 12.5v2M10 12.5v2M1.5 6h2M1.5 10h2M12.5 6h2M12.5 10h2",
  embedded:     "M3.5 3.5h9v9h-9zM6 1.5v2M10 1.5v2M6 12.5v2M10 12.5v2M1.5 6h2M1.5 10h2M12.5 6h2M12.5 10h2",
  tablet:       "M3.5 1.5h9v13h-9zM7 12.5h2",
  "stick-pc":   "M2.5 6.5h9v3h-9zM11.5 7.5h2v1h-2",
  vm:           "M2.5 3.5h11v9h-11zM5.5 6.5h5v3h-5",
  unknown:      "M2.5 3.5h11v9h-11z",
};

// The words a person would use for each chassis class. The class keys are
// the agent's own vocabulary; these are only how they read on the page.
const CLASS_LABELS = {
  laptop: "Laptop", desktop: "Desktop", "mini-pc": "Mini PC", "all-in-one": "All-in-one",
  server: "Server", sbc: "Single-board computer", embedded: "Embedded board",
  tablet: "Tablet", "stick-pc": "Stick PC", vm: "Virtual machine",
};
function classLabel(cls) { return cls ? CLASS_LABELS[cls] || cls : ""; }

function glyph(cls) {
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("width", "16");
  svg.setAttribute("height", "16");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVGNS, "path");
  path.setAttribute("d", GLYPHS[cls] || GLYPHS.unknown);
  path.setAttribute("fill", "none");
  path.setAttribute("stroke", "currentColor");
  path.setAttribute("stroke-width", "1.2");
  path.setAttribute("stroke-linecap", "round");
  path.setAttribute("stroke-linejoin", "round");
  svg.appendChild(path);
  return svg;
}

// The device line: what the machine is, in the words someone would use out
// loud. Unknown parts are dropped rather than dashed — on an identity line
// a row of em dashes tells you less than a shorter line does.
function deviceLine(n) {
  const row = el("div", "device");
  const b = el("div", "badge");
  b.appendChild(glyph(n.deviceClass));
  row.appendChild(b);
  const who = el("div", "who");
  row.appendChild(who);

  const model = deviceModel(n);
  if (!model && !n.deviceClass) {
    row.classList.add("unknown");
    who.appendChild(el("span", null, "unidentified device"));
    row.title = annotateHint(n);
    return row;
  }
  // The model leads because it is the more specific answer; the chassis
  // class sits under it as a category. A class with no model is promoted
  // to the main line rather than leaving it empty.
  who.appendChild(el("span", "model", model || classLabel(n.deviceClass)));
  if (model && n.deviceClass) who.appendChild(el("span", "class", classLabel(n.deviceClass)));
  return row;
}

function deviceModel(n) {
  return [n.deviceVendor, n.deviceModel].filter(Boolean).join(" ");
}

function annotateHint(n) {
  return "No usable DMI on this node. Name it with:\n" +
    "kubectl annotate node " + n.name + " k3s-dash/model=\"…\" k3s-dash/type=laptop";
}

// What the node *is*, as opposed to what it is doing. These values do not
// move between samples, so they belong under the title as context rather
// than in a stat tile with a sparkline. Unknown parts are dropped rather
// than shown as em dashes. The lines have separate sources — capacities and
// platform come from the API server, the CPU model from the node's own
// agent — so any of them can be present without the others.
function specLines(n) {
  const hardware = [];
  if (n.cpuModel) hardware.push(n.cpuModel);
  if (n.cpuCores) hardware.push(n.cpuCores + (n.cpuCores === 1 ? " core" : " cores"));
  if (n.memTotalBytes) hardware.push(fmtBytes(n.memTotalBytes) + " RAM");
  if (n.diskTotalBytes) hardware.push(fmtBytes(n.diskTotalBytes) + " disk");

  const ops = [];
  if (n.internalIP) ops.push(n.internalIP);
  ops.push(n.podCount + (n.podCount === 1 ? " pod" : " pods"));
  if (has(n.uptimeSeconds)) ops.push("up " + fmtUptime(n.uptimeSeconds));

  // The platform strings (OS, kernel, arch, kubelet) and join date live in
  // the device's pop-out instead — on the card they were two more grey
  // lines between the name and the numbers, for facts that rarely matter
  // at a glance.
  return [hardware, ops].filter(parts => parts.length).map(parts => parts.join(" · "));
}

// The worst severity across a node's own metrics, used to accent the
// card's top border — trouble is visible from the section overview
// before anyone reads a single number.
function cardSeverity(n) {
  if (!n.ready) return "critical";
  let worst = "";
  for (const [v, t] of [[n.cpuPercent, THRESHOLDS.cpu], [n.memPercent, THRESHOLDS.mem],
                        [n.diskPercent, THRESHOLDS.disk], [n.tempC, THRESHOLDS.temp]]) {
    const sev = level(v, ...t);
    if (sev === "critical") return "critical";
    if (sev === "warning") worst = "warning";
  }
  if (n.battery && n.battery.status === "Discharging") {
    if (has(n.battery.percent) && n.battery.percent < 25) return "critical";
    worst = worst || "warning";
  }
  return worst;
}

// lastSnapshot lets a click handler (theme toggle, device modal) re-render
// immediately with the data already on screen, rather than waiting for the
// next 5s poll.
let lastSnapshot = null;

function nodeCard(n, s) {
  const sev = cardSeverity(n);
  const card = el("div", "card" + (sev ? " sev-" + sev : ""));

  const head = el("div", "card-head");
  const titleWrap = el("div", "card-title");
  const title = el("h3");
  title.appendChild(el("span", null, n.displayName || n.name));
  // The Kubernetes node name is what kubectl answers to, so a friendly name
  // never replaces it — it only leads.
  if (n.displayName) title.appendChild(el("span", "alias", n.name));
  titleWrap.appendChild(title);
  head.appendChild(titleWrap);
  const pills = el("div", "card-pills");
  if (n.controlPlane) pills.appendChild(el("span", "pill plain", "control-plane"));
  pills.appendChild(el("span", "pill " + (n.ready ? "good" : "critical"), n.ready ? "Ready" : "NotReady"));
  head.appendChild(pills);
  card.appendChild(head);

  card.appendChild(deviceLine(n));
  for (const line of specLines(n)) card.appendChild(el("div", "spec", line));

  const stats = el("div", "stats");

  const cpuSev = level(n.cpuPercent, ...THRESHOLDS.cpu);
  stats.appendChild(tile("CPU", fmtPct(n.cpuPercent), {
    severity: cpuSev, word: cpuSev === "critical" ? "saturated" : "busy",
    viz: sparkline(n.series.cpuPercent, "CPU", "%", { min: 0, max: 100 }),
  }));

  const memSev = level(n.memPercent, ...THRESHOLDS.mem);
  stats.appendChild(tile("Memory", fmtPct(n.memPercent), {
    severity: memSev, word: memSev === "critical" ? "near limit" : "high",
    viz: sparkline(n.series.memPercent, "Memory", "%", { min: 0, max: 100 }),
  }));

  const diskSev = level(n.diskPercent, ...THRESHOLDS.disk);
  stats.appendChild(tile("Disk", fmtPct(n.diskPercent), {
    severity: diskSev, word: diskSev === "critical" ? "almost full" : "filling",
    viz: meter(n.diskPercent, diskSev),
  }));

  if (hasAgentData(n)) {
    const tempSev = level(n.tempC, ...THRESHOLDS.temp);
    stats.appendChild(tile("Temp", fmtTemp(n.tempC), {
      severity: tempSev, word: tempSev === "critical" ? "overheating" : "hot",
      viz: sparkline(n.series.tempC, "Temperature", "°C"),
    }));

    const bat = batteryReadout(n);
    stats.appendChild(tile("Battery", bat.text, {
      wide: true, severity: bat.sev, word: bat.word,
      // A device with no battery has no battery history to draw either.
      viz: bat.absent ? null : sparkline(n.series.batteryPercent, "Battery", "%", { min: 0, max: 100 }),
    }));
  } else {
    stats.appendChild(tile("Agent", "not reporting", {
      wide: true,
      note: "CPU, memory and disk still come from the API server.",
    }));
  }

  card.appendChild(stats);

  // The whole card is the click target for its pop-out — no button, no
  // hint row, just the card. Every card gets one now, even with no pods,
  // because the pop-out also carries the platform details the card leaves
  // out.
  card.classList.add("clickable");
  card.setAttribute("role", "button");
  card.setAttribute("tabindex", "0");
  card.setAttribute("aria-haspopup", "dialog");
  card.setAttribute("aria-label", "View details, workloads and pods for " + (n.displayName || n.name));
  card.addEventListener("click", () => openDeviceModal(n, s));
  card.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDeviceModal(n, s); }
  });

  return card;
}

// The device modal is one shared <dialog>, filled in fresh per click —
// native showModal()/close() give us the backdrop, Escape-to-close and
// focus trapping for free, so there's no custom overlay to get wrong.
function openDeviceModal(n, s) {
  const devicePods = s.pods.filter(p => p.node === n.name);
  const ownerKeys = new Set(
    devicePods.filter(p => p.workload).map(p => p.namespace + "/" + p.workload)
  );
  const deviceWorkloads = s.workloads.filter(w => ownerKeys.has(w.namespace + "/" + w.name));

  document.getElementById("modal-title").textContent = n.displayName || n.name;
  const sub = [];
  if (n.displayName) sub.push(n.name);
  sub.push(n.ready ? "Ready" : "NotReady");
  if (n.controlPlane) sub.push("control-plane");
  document.getElementById("modal-sub").textContent = sub.join(" · ");

  const body = document.getElementById("modal-body");
  body.replaceChildren();

  body.appendChild(modalHeading("Details"));
  body.appendChild(deviceFacts(n));

  if (deviceWorkloads.length) {
    body.appendChild(modalHeading("Workloads", deviceWorkloads.length));
    const wl = el("ul", "drill-list");
    wl.replaceChildren(...deviceWorkloads.map(drillWorkloadRow));
    body.appendChild(wl);
  }
  body.appendChild(modalHeading("Pods", devicePods.length));
  if (devicePods.length) {
    const pl = el("ul", "drill-list");
    pl.replaceChildren(...devicePods.map(drillPodRow));
    body.appendChild(pl);
  } else {
    body.appendChild(el("div", "empty", "No pods scheduled on this device."));
  }

  document.getElementById("device-modal").showModal();
}

// The device's spec sheet: everything that describes the box rather than
// what it is doing. Unknown facts are left out, not dashed, for the same
// reason the identity line drops them.
function deviceFacts(n) {
  const facts = [
    ["Model", deviceModel(n)],
    ["Type", classLabel(n.deviceClass)],
    ["CPU", n.cpuModel],
    ["Cores", n.cpuCores ? n.cpuCores + (n.cpuCores === 1 ? " core" : " cores") : ""],
    ["Memory", n.memTotalBytes ? fmtBytes(n.memTotalBytes) + " RAM" : ""],
    ["Disk", n.diskTotalBytes ? fmtBytes(n.diskTotalBytes) + " disk" : ""],
    ["Internal IP", n.internalIP],
    ["Uptime", has(n.uptimeSeconds) ? fmtUptime(n.uptimeSeconds) : ""],
    ["Joined", fmtSince(n.joinedAt).replace(/^joined /, "")],
    ["OS", n.osImage],
    ["Kernel", n.kernelVersion],
    ["Architecture", n.architecture],
    ["Kubelet", n.kubeletVersion],
  ];
  const dl = el("dl", "facts");
  for (const [k, v] of facts) {
    if (!v) continue;
    const row = el("div");
    row.appendChild(el("dt", null, k));
    row.appendChild(el("dd", k === "Internal IP" || k === "Kernel" || k === "Kubelet" ? "mono" : null, v));
    dl.appendChild(row);
  }
  if (!deviceModel(n) && !n.deviceClass) {
    const row = el("div");
    row.appendChild(el("dt", null, "Model"));
    const dd = el("dd", null, "unidentified device");
    dd.title = annotateHint(n);
    row.appendChild(dd);
    dl.prepend(row);
  }
  return dl;
}

// Clicking the dialog's own backdrop area lands a click on the <dialog>
// element itself, never on a child — that's what tells a real backdrop
// click apart from a click inside the modal body.
function initDeviceModal() {
  const modal = document.getElementById("device-modal");
  modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
  document.getElementById("modal-close").addEventListener("click", () => modal.close());
}

function sortedNodes(nodes) {
  return nodes.slice().sort((a, b) => {
    const na = a.name.match(/\d+$/), nb = b.name.match(/\d+$/);
    if (na && nb) return Number(na[0]) - Number(nb[0]) || a.name.localeCompare(b.name);
    if (na || nb) return na ? -1 : 1;
    return a.name.localeCompare(b.name);
  });
}

function fleetKPIs(fleet) {
  const series = fleet.series || {};
  const down = fleet.devices - fleet.ready;
  const readySev = down > 0 ? "critical" : "";

  const readyValue = el("span", "kpi-value");
  readyValue.appendChild(document.createTextNode(String(fleet.ready)));
  readyValue.appendChild(el("span", "of", "/" + fleet.devices));

  const cards = [];

  cards.push(kpiCard("devices", {}, "Devices ready", null, {
    valueNode: readyValue, severity: readySev, word: "not ready",
    note: down === 0
      ? (fleet.devices === 1 ? "Ready" : "All ready")
      : down + (down === 1 ? " device is not ready" : " devices are not ready"),
  }));

  const cpuSev = level(fleet.cpuPercent, ...THRESHOLDS.cpu);
  cards.push(kpiCard("cpu", {}, "CPU", fmtPct(fleet.cpuPercent), {
    severity: cpuSev, word: cpuSev === "critical" ? "saturated" : "busy",
    viz: sparkline(series.cpuPercent, "Cluster CPU", "%", { min: 0, max: 100, width: 150 }),
    note: fleet.cpuCores ? fleet.cpuCores + " cores total" : "",
  }));

  const memSev = level(fleet.memPercent, ...THRESHOLDS.mem);
  cards.push(kpiCard("memory", {}, "Memory", fmtPct(fleet.memPercent), {
    severity: memSev, word: memSev === "critical" ? "near limit" : "high",
    viz: sparkline(series.memPercent, "Cluster memory", "%", { min: 0, max: 100, width: 150 }),
    note: fleet.memTotalBytes ? fmtBytes(fleet.memTotalBytes) + " total" : "",
  }));

  const diskSev = level(fleet.diskPercent, ...THRESHOLDS.disk);
  cards.push(kpiCard("disk", {}, "Disk", fmtPct(fleet.diskPercent), {
    severity: diskSev, word: diskSev === "critical" ? "almost full" : "filling",
    viz: sparkline(series.diskPercent, "Cluster disk", "%", { min: 0, max: 100, width: 150 }),
  }));

  const tempSev = level(fleet.hottestC, ...THRESHOLDS.temp);
  cards.push(kpiCard("temp", { circle: [10, 13, 3] }, "Hottest", fmtTemp(fleet.hottestC), {
    severity: tempSev, word: tempSev === "critical" ? "overheating" : "hot",
    viz: sparkline(series.tempC, "Hottest device", "°C", { width: 150 }),
    note: fleet.hottestNode || "",
  }));

  cards.push(kpiCard("power", { fill: true }, "Power", fleet.onBattery ? fleet.onBattery + " unplugged" : "all on AC", {
    // "unplugged" in the value already is the severity word, so a second
    // chip saying "on battery" would only repeat it (and wrap the cell).
    severity: fleet.onBattery ? "warning" : "", word: "on battery", wordInValue: true,
    note: fleet.onBattery ? (fleet.devices - fleet.onBattery) + " on AC" : "",
  }));

  cards.push(kpiCard("workloads", {}, "Workloads", fleet.workloadsDegraded
    ? fleet.workloadsDegraded + " of " + fleet.workloadsTotal
    : "all healthy", {
    severity: fleet.workloadsDegraded ? "critical" : "", word: "degraded",
    note: fleet.pods + (fleet.pods === 1 ? " pod" : " pods") + " across " +
      fleet.workloadsTotal + (fleet.workloadsTotal === 1 ? " workload" : " workloads"),
  }));

  return cards;
}

// "4m ago" for an event — coarser than a pod's age on purpose, since the
// warnings panel only ever covers the last hour.
function fmtAgo(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (isNaN(s) || String(iso).startsWith("0001")) return "";
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  return Math.floor(s / 3600) + "h ago";
}

function alertCard(e) {
  const li = el("li", "alert");
  const iconWrap = el("div", "alert-icon");
  iconWrap.appendChild(icon("alert"));
  li.appendChild(iconWrap);
  const body = el("div", "alert-body");
  const head = el("div", "alert-head");
  head.appendChild(el("strong", null, e.reason));
  head.appendChild(el("span", "obj", e.namespace + "/" + e.object));
  if (e.count > 1) head.appendChild(el("span", "count", "×" + e.count));
  const when = fmtAgo(e.at);
  if (when) head.appendChild(el("span", "when", when));
  body.appendChild(head);
  body.appendChild(el("div", "msg", e.message));
  li.appendChild(body);
  return li;
}

// An empty table still needs one full-width row, or the header floats
// over nothing and reads as a rendering bug.
function emptyRow(cols, text) {
  const tr = el("tr");
  const c = td("empty", text);
  c.colSpan = cols;
  tr.appendChild(c);
  return tr;
}

function render(s) {
  lastSnapshot = s;
  document.getElementById("kpis").replaceChildren(...fleetKPIs(s.fleet));

  const nodes = sortedNodes(s.nodes);
  document.getElementById("nodes").replaceChildren(...nodes.map(n => nodeCard(n, s)));
  document.getElementById("devices-count").textContent = String(nodes.length);
  if (room) room.update(s);

  document.getElementById("namespaces-count").textContent = String(s.namespaces.length);
  const namespacesList = document.getElementById("namespaces");
  if (s.namespaces.length) {
    namespacesList.replaceChildren(...s.namespaces.map(namespaceRow));
  } else {
    namespacesList.replaceChildren(emptyRow(4, "No namespaces reported."));
  }

  document.getElementById("workloads-count").textContent = String(s.workloads.length);
  const workloadsList = document.getElementById("workloads");
  if (s.workloads.length) {
    workloadsList.replaceChildren(...s.workloads.map(workloadRow));
  } else {
    workloadsList.replaceChildren(emptyRow(6, "No workloads reported."));
  }

  document.getElementById("events-count").textContent = s.events.length ? String(s.events.length) : "";
  const events = document.getElementById("events");
  if (s.events.length) {
    events.replaceChildren(...s.events.map(alertCard));
  } else {
    const empty = el("li", "empty ok");
    empty.appendChild(icon("check"));
    empty.appendChild(el("span", null, "No warnings in the last hour."));
    events.replaceChildren(empty);
  }

  const banner = document.getElementById("degraded");
  const notes = [];
  if (s.meta.degraded && s.meta.degraded.length) {
    notes.push("Not reporting: " + s.meta.degraded.join(", ") + ".");
  }

  const sampled = new Date(s.meta.sampledAt);
  const age = Math.round((Date.now() - sampled.getTime()) / 1000);
  const first = isNaN(age) || String(s.meta.sampledAt).startsWith("0001");
  document.getElementById("stamp").textContent = first
    ? "Waiting for the first sample…"
    : "Updated " + (age < 60 ? age + "s" : Math.round(age / 60) + "m") + " ago";

  // A snapshot older than four intervals means the sample loop is stuck or
  // the API server is unreachable. What is on screen is then history, not
  // status, and the page has to say so.
  const maxAge = 4 * (s.meta.sampleIntervalSeconds || 15);
  const stale = !first && age > maxAge;
  document.getElementById("live").classList.toggle("stale", stale || first);
  if (stale) {
    notes.push("Stale: last successful sample was " +
      (age < 120 ? age + "s" : Math.round(age / 60) + "m") +
      " ago, so these numbers may no longer be current.");
  }

  if (notes.length) {
    banner.replaceChildren(icon("alert"), el("span", null, notes.join(" ")));
    banner.classList.add("on");
  } else {
    banner.classList.remove("on");
  }
}

// Density is a viewing preference, so it lives in the browser rather than in
// the cluster. Storage can throw in a private window, and a dashboard that
// fails to render because it could not remember a layout choice would be a
// poor trade.
const DENSITY_KEY = "k3s-dash.density";

function applyDensity(mode) {
  const detailed = mode === "detailed";
  document.body.classList.toggle("detailed", detailed);
  document.getElementById("density-compact").setAttribute("aria-pressed", String(!detailed));
  document.getElementById("density-detailed").setAttribute("aria-pressed", String(detailed));
  try { localStorage.setItem(DENSITY_KEY, mode); } catch (err) { /* not fatal */ }
}

function initDensity() {
  let saved = "compact";
  try { saved = localStorage.getItem(DENSITY_KEY) || "compact"; } catch (err) { /* not fatal */ }
  applyDensity(saved);
  document.getElementById("density-compact").addEventListener("click", () => applyDensity("compact"));
  document.getElementById("density-detailed").addEventListener("click", () => applyDensity("detailed"));
}

// Theme is also a viewing preference: "Auto" removes the override and lets
// prefers-color-scheme decide, matching the two dark-mode CSS scopes this
// page has always shipped. Badge colours are theme-invariant, but the
// sparkline stroke reads off CSS vars, so a re-render on toggle is what
// makes the switch feel instant rather than waiting for the next poll.
const THEME_KEY = "k3s-dash.theme";

function applyTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.setAttribute("data-theme", mode);
  else document.documentElement.removeAttribute("data-theme");
  for (const m of ["auto", "light", "dark"]) {
    document.getElementById("theme-" + m).setAttribute("aria-pressed", String(m === mode));
  }
  try { localStorage.setItem(THEME_KEY, mode); } catch (err) { /* not fatal */ }
  if (room) room.setDark(isDark());
  if (lastSnapshot) render(lastSnapshot);
}

function initTheme() {
  let saved = "auto";
  try { saved = localStorage.getItem(THEME_KEY) || "auto"; } catch (err) { /* not fatal */ }
  applyTheme(saved);
  document.getElementById("theme-auto").addEventListener("click", () => applyTheme("auto"));
  document.getElementById("theme-light").addEventListener("click", () => applyTheme("light"));
  document.getElementById("theme-dark").addEventListener("click", () => applyTheme("dark"));
}

// The 3D room is optional and lazy: three.js (~700 KB) is only fetched the
// first time someone asks for it, and any failure leaves the cards in place.
const VIEW_KEY = "k3s-dash.view";
let room = null;
let roomLoading = false;

function webglAvailable() {
  try { return !!document.createElement("canvas").getContext("webgl2"); } catch (err) { return false; }
}

// The room follows the page theme: daylight normally, lights-out in dark mode.
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
}

function roomMessage(text) { document.getElementById("room3d-msg").textContent = text || ""; }

async function setView(v) {
  const want3d = v === "3d";
  if (want3d && roomLoading) return;
  document.getElementById("view-cards").setAttribute("aria-pressed", String(!want3d));
  document.getElementById("view-3d").setAttribute("aria-pressed", String(want3d));
  document.getElementById("nodes").hidden = want3d;
  document.getElementById("room3d").hidden = !want3d;
  document.getElementById("devices-hint").textContent = want3d
    ? "Drag to orbit · scroll to zoom · click a device, or use ‹ › to step through them"
    : "Click a device for details";
  try { localStorage.setItem(VIEW_KEY, v); } catch (err) { /* not fatal */ }
  if (!want3d) { if (room) room.setVisible(false); return; }
  if (room) { room.setVisible(true); return; }
  roomLoading = true;
  roomMessage("Loading the 3D room…");
  try {
    const mod = await import("/static/room3d.js?v=0.21.2");
    room = mod.mount(document.getElementById("room3d"), {
      dark: isDark(),
      onDetails(name) {
        const n = lastSnapshot && lastSnapshot.nodes.find(x => x.name === name);
        if (n) openDeviceModal(n, lastSnapshot);
      },
      onError(msg) { roomMessage(msg); },
    });
    roomMessage("");
    if (lastSnapshot) room.update(lastSnapshot);
  } catch (err) {
    room = null;
    roomMessage("The 3D room could not be loaded. The card view is unaffected.");
    console.error("3D room:", err);
  } finally {
    roomLoading = false;
  }
}

function initView() {
  const btn3d = document.getElementById("view-3d");
  if (!webglAvailable()) {
    btn3d.disabled = true;
    btn3d.title = "This browser or device does not support WebGL";
  } else {
    btn3d.addEventListener("click", () => setView("3d"));
    let saved = "cards";
    try { saved = localStorage.getItem(VIEW_KEY) || "cards"; } catch (err) { /* not fatal */ }
    if (saved === "3d") setView("3d");
  }
  document.getElementById("view-cards").addEventListener("click", () => setView("cards"));
  if (typeof matchMedia === "function") {
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (room) room.setDark(isDark()); });
  }
}

async function tick() {
  const main = document.getElementById("main");
  try {
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
    main.classList.remove("stale");
  } catch (err) {
    // Hold the previous render rather than blanking the page.
    main.classList.add("stale");
    document.getElementById("stamp").textContent = "Dashboard unreachable, retrying…";
    document.getElementById("live").classList.add("stale");
  }
}

document.getElementById("logo").appendChild(logoMark());
for (const id of ["modal-close", "namespace-modal-close"]) {
  document.getElementById(id).appendChild(icon("close", { size: 18 }));
}
initDensity();
initTheme();
initDeviceModal();
initNamespaceModal();
initView();
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
